services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledge-agent-postgres
    environment:
      POSTGRES_DB: knowledge_agent
      POSTGRES_USER: knowledge_agent
      POSTGRES_PASSWORD: local_password
    ports:
      - "127.0.0.1:${KNOWLEDGE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - knowledge_agent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_agent -d knowledge_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  knowledge_agent_postgres_data:
