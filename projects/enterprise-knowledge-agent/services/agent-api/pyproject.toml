[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-agent-api"
version = "0.1.0"
description = "API service for the enterprise knowledge agent"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.7,<3.0",
    "alembic>=1.14,<2.0",
    "pgvector>=0.3,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "ollama>=0.6,<1.0",
    "openai>=1.100,<2.0",
    "pymupdf>=1.26,<2.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100