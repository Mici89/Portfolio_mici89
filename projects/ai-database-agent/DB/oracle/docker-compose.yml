services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: ai-db-logistics-oracle
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ORACLE_PORT:-1522}:1521"
    environment:
      TZ: Asia/Shanghai
      ORACLE_PASSWORD: "${ORACLE_PASSWORD:-LocalSys_2026_TestOnly}"
      APP_USER: LOGISTICS_APP
      APP_USER_PASSWORD: "${APP_USER_PASSWORD:-Logistics_2026_TestOnly}"
    volumes:
      - ./data:/opt/oracle/oradata
      - ./init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 90s
